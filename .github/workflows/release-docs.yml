# =============================================================================
# Workflow: Release documentation
# =============================================================================
# Назначение: Автоматическая сборка документации (VitePress), создание
#             GitHub-релиза с артефактом и публикация на GitHub Pages.
# Триггеры:
#   1. Push в main при изменении package.json (предполагается, что версия
#      в package.json была bumped — это сигнал к релизу).
#   2. Ручной запуск (workflow_dispatch) для отладки или форсирования.
# =============================================================================

name: Release documentation

# -----------------------------------------------------------------------------
# Триггеры запуска workflow
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - main # Только из main — релизы запрещены из других веток
    paths:
      - package.json # Запускаем только если поменялась версия в манифесте

  workflow_dispatch: # Ручной запуск через UI GitHub Actions

# -----------------------------------------------------------------------------
# Конкурентность: предотвращаем одновременный запуск нескольких релизов
# -----------------------------------------------------------------------------
# Группа уникальна для ref (обычно main). cancel-in-progress: false означает,
# что новый запуск будет ждать завершения текущего, а не прерывать его.
# Это важно для релизов — не хотим обрывать частично созданный релиз.
# -----------------------------------------------------------------------------
concurrency:
  group: docs-release-${{ github.ref }}
  cancel-in-progress: false

# =============================================================================
# JOBS
# =============================================================================
jobs:
  # ===========================================================================
  # Job 1: Сборка и создание релиза
  # ===========================================================================
  build-and-release:
    name: Build and create release
    runs-on: ubuntu-latest

    # Права: нужен write на contents для создания тегов и релизов
    permissions:
      contents: write

    steps:
      # -----------------------------------------------------------------------
      # Шаг 1.1: Клонирование репозитория
      # -----------------------------------------------------------------------
      # fetch-depth: 0 — полная история коммитов, нужна для:
      #   • Проверки существования тегов (git show-ref)
      #   • Генерации release notes (авто changelog)
      # persist-credentials: false — безопасность, токен не сохраняется в git config
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Шаг 1.2: Установка Node.js
      # -----------------------------------------------------------------------
      # node-version: 24 — используем последний стабильный Node.js
      # cache: npm — кэширует node_modules между запусками для ускорения
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # -----------------------------------------------------------------------
      # Шаг 1.3: Чтение и валидация версии из package.json
      # -----------------------------------------------------------------------
      # Выполняем строгие проверки перед релизом:
      #   1. Убеждаемся, что запущены из main (доп. защита на уровне job)
      #   2. Версия должна соответствовать SemVer (MAJOR.MINOR.PATCH[-prerelease][+build])
      #   3. Тег v{VERSION} не должен существовать, либо должен указывать
      #      на текущий коммит (идемпотентность — повторный запуск не ломается)
      #
      # Выходные переменные (GITHUB_OUTPUT):
      #   • version — чистая версия (например, 1.2.3)
      #   • tag     — тег с префиксом v (например, v1.2.3)
      # -----------------------------------------------------------------------
      - name: Read and validate version
        id: meta
        shell: bash
        run: |
          # --- Защита: релизы только из main ---
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are allowed only from the main branch"
            exit 1
          fi

          # --- Извлекаем версию из package.json ---
          VERSION="$(node -p "require('./package.json').version")"

          # --- Валидация SemVer по спецификации ---
          # Регулярное выражение покрывает:
          #   core: MAJOR.MINOR.PATCH (каждая — 0 или положительное число без ведущих нулей)
          #   pre-release: -{alphanumeric}.{alphanumeric}...
          #   build: +{alphanumeric}.{alphanumeric}...
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version must be valid SemVer, got: $VERSION"
            exit 1
          fi

          # --- Проверка тега на коллизии ---
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG already points to $TAG_COMMIT. Increase package.json version."
              exit 1
            fi
          fi

          # --- Экспорт метаданных для downstream-шагов ---
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Шаг 1.4: Установка зависимостей
      # -----------------------------------------------------------------------
      # npm ci — чистая установка по package-lock.json, строго воспроизводима
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Шаг 1.5: Определение базового пути для GitHub Pages
      # -----------------------------------------------------------------------
      # VitePress требует знать base URL для корректной генерации относительных
      # ссылок. Логика определения:
      #   1. Если задана переменная репозитория DOCS_BASE — используем её
      #   2. Иначе: если репозиторий — user.github.io, base = /
      #      иначе base = /repo-name/
      #
      # Валидация: путь обязан начинаться и заканчиваться на /
      # Результат записывается в GITHUB_ENV для использования в скриптах сборки
      # -----------------------------------------------------------------------
      - name: Configure GitHub Pages base path
        shell: bash
        env:
          CONFIGURED_DOCS_BASE: ${{ vars.DOCS_BASE }}
        run: |
          # Приоритет: явно заданная переменная репозитория
          if [[ -n "$CONFIGURED_DOCS_BASE" ]]; then
            BASE="$CONFIGURED_DOCS_BASE"
          else
            # Извлекаем имя репозитория из GITHUB_REPOSITORY (owner/repo)
            REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
            # Специальный случай: user/org pages (репозиторий *.github.io)
            if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
              BASE="/"
            else
              BASE="/$REPOSITORY_NAME/"
            fi
          fi

          # Валидация формата base path
          if [[ "$BASE" != /* || "$BASE" != */ ]]; then
            echo "::error::DOCS_BASE must start and end with '/': $BASE"
            exit 1
          fi

          # Передаём в окружение для шага сборки
          echo "DOCS_BASE=$BASE" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Шаг 1.6: Сборка документации через VitePress
      # -----------------------------------------------------------------------
      # Сборка производится в docs/.vitepress/dist
      # DOCS_BASE из предыдущего шага подхватывается конфигурацией VitePress
      # -----------------------------------------------------------------------
      - name: Build documentation with Vite
        run: npm run build

      # -----------------------------------------------------------------------
      # Шаг 1.7: Упаковка артефакта для релиза
      # -----------------------------------------------------------------------
      # Создаём tar.gz архив содержимого dist-директории.
      # -C docs/.vitepress/dist . — заходим в директорию и архивируем содержимое,
      # чтобы в архиве не было лишних вложенных папок.
      #
      # Выходная переменная:
      #   • archive — имя файла архива (например, dsa-docs-v1.2.3.tar.gz)
      # -----------------------------------------------------------------------
      - name: Package release artifact
        id: artifact
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ARCHIVE="dsa-docs-$TAG.tar.gz"
          tar -czf "$ARCHIVE" -C docs/.vitepress/dist .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Шаг 1.8: Загрузка артефакта для GitHub Pages
      # -----------------------------------------------------------------------
      # Передаём собранный dist в downstream job deploy через
      # actions/upload-pages-artifact. Это стандартный способ подготовки
      # артефакта для deploy-pages.
      # -----------------------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      # -----------------------------------------------------------------------
      # Шаг 1.9: Создание GitHub Release
      # -----------------------------------------------------------------------
      # Используем GitHub CLI (gh) для создания релиза:
      #   • --target — привязываем к конкретному коммиту
      #   • --generate-notes — автогенерация changelog из PR и коммитов
      #   • Архив прикрепляется как asset
      #
      # Идемпотентность: если релиз уже существует — пропускаем без ошибки.
      # Это позволяет безопасно перезапускать workflow.
      # -----------------------------------------------------------------------
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it unchanged."
          else
            gh release create "$TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

  # ===========================================================================
  # Job 2: Деплой на GitHub Pages
  # ===========================================================================
  # Зависимость: build-and-release — деплоим только если сборка и релиз
  #              прошли успешно. Разделение на job'ы позволяет:
  #   • Иметь отдельные permissions (deploy не нужен write на contents)
  #   • Иметь отдельный environment для tracking deploy'ев
  # ===========================================================================
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-release
    runs-on: ubuntu-latest

    # Права для deploy-pages:
    #   • contents: read — нужен для checkout (неявно)
    #   • pages: write — право на деплой в Pages
    #   • id-token: write — OIDC-токен для аутентификации с Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    # Environment: позволяет отслеживать деплои в разделе Environments репозитория,
    # настраивать protection rules (required reviewers, wait timer) и видеть
    # URL развёрнутого сайта прямо в UI.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # -----------------------------------------------------------------------
      # Шаг 2.1: Конфигурация GitHub Pages
      # -----------------------------------------------------------------------
      # Подготавливает окружение Pages: статический сайт, корректный base URL.
      # -----------------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # -----------------------------------------------------------------------
      # Шаг 2.2: Деплой на GitHub Pages
      # -----------------------------------------------------------------------
      # Забирает артефакт, загруженный в шаге 1.8 (upload-pages-artifact),
      # и публикует его. Выходная переменная page_url содержит URL сайта.
      # -----------------------------------------------------------------------
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
